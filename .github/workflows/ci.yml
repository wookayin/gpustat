name: "Run Tests"
on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: "Unit Tests"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.11"
            pynvml-version: 11.495.46  # legacy pynvml, see #143
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
            allow-prereleases: true
          - os: ubuntu-latest
            python-version: "3.16-dev"
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}

      - name: Upgrade pip
        run: |
          python -m pip install -U pip

      - name: Configure environments
        run: |
          python --version

      - name: Install dependencies
        run: |
          python -m pip install -e ".[test]"
          if [ -n "${{ matrix.pynvml-version }}" ]; then
            python -m pip install nvidia-ml-py==${{ matrix.pynvml-version }}
          fi
          python -m gpustat --version

      - name: Run tests
        run: |
          python -m pytest --color=yes -v -s
        env:
          PYTHONIOENCODING: UTF-8
